<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Potato Head</title>

    <link rel="stylesheet" href="potato.css">
</head>
<body class="day">
    <header>
        <h1>🥔 Mr. Potato Head</h1>

        <div class="controls">
            <!-- background music, loops forever -->
            <audio id="music" src="music/Wheels on the Bus @CoComelon Nursery Rhymes & Kids Songs.mp3" loop></audio>
           <!-- <audio id="music2" src="music/Wheels on the Bus @CoComelon Nursery Rhymes & Kids Songs.mp3" loop></audio> -->
            <button id="musicBtn">♪ music off</button>
            <button id="backgroundBtn">🌙 night</button>
            <button id="clear">clear</button>
        </div>

        <!-- save a design and a list of saved designs to load -->
        <div class="controls">
            <input id="designName" type="text" placeholder="design name">
            <button id="save">save</button>
            <!-- homemade dropdown (a real <select> can't have an x on each option) -->
            <div id="designsMenu" class="dropdown">
                <button id="designsBtn">saved designs ▾</button>
                <ul id="designs"></ul>
            </div>
        </div>
    </header>

    <!-- data-part is the name of the 3d model in the js, the pictures are rendered from the models when the page opens -->
    <aside id="sidebar">
        <section class="category">
            <h2>Eyes</h2>
            <div class="parts">
                <div class="part" data-part="eyes-googly"><img alt="googly eyes"></div>
                <div class="part" data-part="eyes-big"><img alt="big eyes"></div>
                <div class="part" data-part="eyes-lashes"><img alt="eyes with lashes"></div>
                <div class="part" data-part="eyes-sleepy"><img alt="sleepy blue eyes"></div>
            </div>
        </section>

        <section class="category">
            <h2>Eyebrows</h2>
            <div class="parts">
                <div class="part" data-part="brows-happy"><img alt="happy eyebrows"></div>
                <div class="part" data-part="brows-angry"><img alt="angry eyebrows"></div>
            </div>
        </section>

        <section class="category">
            <h2>Nose</h2>
            <div class="parts">
                <div class="part" data-part="nose-orange"><img alt="orange nose"></div>
                <div class="part" data-part="nose-red"><img alt="red clown nose"></div>
            </div>
        </section>

        <section class="category">
            <h2>Mouth</h2>
            <div class="parts">
                <div class="part" data-part="mouth-teeth"><img alt="toothy smile"></div>
                <div class="part" data-part="mouth-lips"><img alt="red lips"></div>
            </div>
        </section>

        <section class="category">
            <h2>Mustache</h2>
            <div class="parts">
                <div class="part" data-part="mustache"><img alt="mustache with teeth"></div>
            </div>
        </section>

        <section class="category">
            <h2>Ears</h2>
            <div class="parts">
                <div class="part" data-part="ear-left"><img alt="left ear"></div>
                <div class="part" data-part="ear-right"><img alt="right ear"></div>
            </div>
        </section>

        <section class="category">
            <h2>Hats</h2>
            <div class="parts">
                <div class="part" data-part="hat-top"><img alt="top hat"></div>
                <div class="part" data-part="hat-cap"><img alt="baseball cap"></div>
                <div class="part" data-part="hat-party"><img alt="party hat"></div>
                <div class="part" data-part="wig-blonde"><img alt="blonde wig"></div>
                <div class="part" data-part="wig-brown"><img alt="brown wig"></div>
            </div>
        </section>

        <section class="category">
            <h2>Arms</h2>
            <div class="parts">
                <div class="part" data-part="arm-left"><img alt="left arm"></div>
                <div class="part" data-part="arm-right"><img alt="right arm"></div>
            </div>
        </section>

        <section class="category">
            <h2>Shoes</h2>
            <div class="parts">
                <div class="part" data-part="shoes-brown"><img alt="brown shoes"></div>
                <div class="part" data-part="shoes-red"><img alt="red sneakers"></div>
            </div>
        </section>

        <section class="category">
            <h2>Extras</h2>
            <div class="parts">
                <div class="part" data-part="glasses-red"><img alt="red glasses"></div>
                <div class="part" data-part="disguise"><img alt="disguise glasses"></div>
            </div>
        </section>
    </aside>

    <main id="playArea">
        <!-- the 3d potato is drawn here -->
        <canvas id="scene"></canvas>

        <p id="hint">drag parts onto the potato · drag the background to spin him · scroll on a part to resize · double click a part to twist it</p>
        <div id="trash" title="drop a part here to throw it away">🗑️</div>
    </main>

    <script src="jquery-4.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="mrpotatohead.js"></script>
</body>
</html>
