<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e2e"/>
      <stop offset="0.5" stop-color="#1d2a6b"/>
      <stop offset="0.8" stop-color="#3e3f8f"/>
      <stop offset="1" stop-color="#6a4f98"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d8" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#c9d4ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#8090ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffbea"/>
      <stop offset="1" stop-color="#e9dfb8"/>
    </radialGradient>
    <!-- a tile of stars repeated across the sky -->
    <pattern id="stars" width="420" height="300" patternUnits="userSpaceOnUse">
      <g fill="#ffffff">
        <circle cx="20" cy="30" r="1.6" opacity="0.9"/><circle cx="90" cy="140" r="1.1" opacity="0.6"/>
        <circle cx="150" cy="60" r="2" opacity="0.95"/><circle cx="210" cy="230" r="1.2" opacity="0.5"/>
        <circle cx="260" cy="110" r="1.5" opacity="0.8"/><circle cx="330" cy="20" r="1" opacity="0.6"/>
        <circle cx="380" cy="180" r="1.8" opacity="0.85"/><circle cx="60" cy="250" r="1.3" opacity="0.7"/>
        <circle cx="300" cy="270" r="1" opacity="0.5"/><circle cx="180" cy="160" r="0.9" opacity="0.5"/>
        <circle cx="400" cy="80" r="1.1" opacity="0.6"/><circle cx="120" cy="10" r="1" opacity="0.6"/>
      </g>
    </pattern>
    <linearGradient id="starFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.65" stop-color="#fff" stop-opacity="0.2"/>
      <stop offset="0.75" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="starMask"><rect width="1600" height="900" fill="url(#starFade)"/></mask>
    <radialGradient id="puff" cx="0.6" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#8e9be0"/>
      <stop offset="0.6" stop-color="#3f4b93"/>
      <stop offset="1" stop-color="#2a3372"/>
    </radialGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f88"/>
      <stop offset="1" stop-color="#2b3070"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25407a"/>
      <stop offset="1" stop-color="#1a2d5a"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a5e"/>
      <stop offset="1" stop-color="#0f1c33"/>
    </linearGradient>
    <radialGradient id="leaves" cx="0.7" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#4a74b8"/>
      <stop offset="0.5" stop-color="#1f3d6e"/>
      <stop offset="1" stop-color="#132646"/>
    </radialGradient>
    <radialGradient id="windowGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf6b" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffcf6b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="firefly" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbb0"/>
      <stop offset="0.3" stop-color="#e8ff6b" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#d4ff4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.55" stop-color="#05061a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05061a" stop-opacity="0.5"/>
    </radialGradient>

    <g id="cloud">
      <circle cx="0" cy="0" r="55" fill="url(#puff)"/>
      <circle cx="65" cy="-28" r="72" fill="url(#puff)"/>
      <circle cx="150" cy="-8" r="58" fill="url(#puff)"/>
      <circle cx="205" cy="18" r="40" fill="url(#puff)"/>
      <ellipse cx="100" cy="32" rx="140" ry="30" fill="#2a3372"/>
    </g>
    <g id="tree">
      <path d="M-9 0 Q-6 -60 -4 -110 L4 -110 Q6 -60 9 0 Z" fill="#1b2240"/>
      <circle cx="0" cy="-150" r="62" fill="url(#leaves)"/>
      <circle cx="-42" cy="-120" r="40" fill="url(#leaves)"/>
      <circle cx="44" cy="-118" r="42" fill="url(#leaves)"/>
    </g>
    <g id="sparkle">
      <path d="M0 -12 Q1.5 -1.5 12 0 Q1.5 1.5 0 12 Q-1.5 1.5 -12 0 Q-1.5 -1.5 0 -12 Z" fill="#fff"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#stars)" mask="url(#starMask)"/>
  <use href="#sparkle" transform="translate(260 120)"/>
  <use href="#sparkle" transform="translate(880 70) scale(0.7)"/>
  <use href="#sparkle" transform="translate(560 260) scale(0.5)"/>
  <use href="#sparkle" transform="translate(1500 90) scale(0.6)"/>

  <!-- the moon, glowing, with a couple of soft craters -->
  <circle cx="1250" cy="200" r="280" fill="url(#moonGlow)"/>
  <circle cx="1250" cy="200" r="78" fill="url(#moon)"/>
  <g fill="#d8cd9f" opacity="0.6">
    <circle cx="1225" cy="180" r="14"/><circle cx="1275" cy="225" r="10"/><circle cx="1268" cy="168" r="7"/>
  </g>

  <use href="#cloud" transform="translate(220 200) scale(0.8)" opacity="0.9"/>
  <use href="#cloud" transform="translate(1030 300) scale(0.55)" opacity="0.85"/>

  <path d="M0 590 Q220 520 480 570 T980 555 T1600 540 V700 H0 Z" fill="url(#farHill)"/>
  <!-- moonlight catching the top of the far hills -->
  <path d="M0 590 Q220 520 480 570 T980 555 T1600 540" fill="none" stroke="#8fa0ff" stroke-width="3" opacity="0.35"/>

  <!-- the cottage with its lights on -->
  <g transform="translate(1080 560)">
    <circle cx="0" cy="-26" r="90" fill="url(#windowGlow)" opacity="0.5"/>
    <rect x="-38" y="-46" width="76" height="46" fill="#2c3466"/>
    <path d="M-48 -44 L0 -84 L48 -44 Z" fill="#3a2f5e"/>
    <rect x="18" y="-92" width="12" height="26" fill="#2a2450"/>
    <rect x="-10" y="-28" width="18" height="28" fill="#1a1838"/>
    <rect x="-30" y="-36" width="14" height="14" fill="#ffd47a"/>
    <rect x="18" y="-36" width="14" height="14" fill="#ffd47a"/>
  </g>

  <path d="M0 660 Q300 580 650 640 T1600 610 V900 H0 Z" fill="url(#midHill)"/>
  <use href="#tree" transform="translate(140 690) scale(0.85)"/>
  <use href="#tree" transform="translate(1460 660) scale(0.95)"/>
  <use href="#tree" transform="translate(1530 690) scale(0.7)"/>

  <path d="M0 760 Q400 670 850 740 T1600 720 V900 H0 Z" fill="url(#nearHill)"/>
  <path d="M0 760 Q400 670 850 740 T1600 720" fill="none" stroke="#6f8cff" stroke-width="2.5" opacity="0.3"/>

  <!-- fireflies -->
  <g>
    <circle cx="300" cy="700" r="16" fill="url(#firefly)"/>
    <circle cx="470" cy="640" r="12" fill="url(#firefly)"/>
    <circle cx="610" cy="760" r="14" fill="url(#firefly)"/>
    <circle cx="1010" cy="690" r="13" fill="url(#firefly)"/>
    <circle cx="1180" cy="770" r="16" fill="url(#firefly)"/>
    <circle cx="1330" cy="620" r="11" fill="url(#firefly)"/>
    <circle cx="200" cy="820" r="12" fill="url(#firefly)"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
