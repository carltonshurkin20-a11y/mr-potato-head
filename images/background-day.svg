<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- warm glow at the horizon, deep blue at the top, like a movie sunrise -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d97e0"/>
      <stop offset="0.45" stop-color="#8fd0f7"/>
      <stop offset="0.72" stop-color="#ffe7c2"/>
      <stop offset="1" stop-color="#ffd59e"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="0.25" stop-color="#fff2b8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fffbe0" stop-opacity="0"/>
    </linearGradient>
    <!-- each cloud puff is lit from the top and shaded underneath -->
    <radialGradient id="puff" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#c9def3"/>
    </radialGradient>
    <linearGradient id="mountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d3ee"/>
      <stop offset="1" stop-color="#d8e6f2"/>
    </linearGradient>
    <linearGradient id="farHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5dd8f"/>
      <stop offset="1" stop-color="#9fcf7f"/>
    </linearGradient>
    <linearGradient id="midHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd16a"/>
      <stop offset="1" stop-color="#6fbb4d"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc24c"/>
      <stop offset="1" stop-color="#3f8f31"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e2b5"/>
      <stop offset="1" stop-color="#e2be84"/>
    </linearGradient>
    <radialGradient id="leaves" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#9be36d"/>
      <stop offset="0.6" stop-color="#4fae3c"/>
      <stop offset="1" stop-color="#2f7d2a"/>
    </radialGradient>
    <radialGradient id="leavesFar" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#bde89b"/>
      <stop offset="1" stop-color="#7fbf66"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0.6" stop-color="#2a1a40" stop-opacity="0"/>
      <stop offset="1" stop-color="#2a1a40" stop-opacity="0.28"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <g id="cloud">
      <circle cx="0" cy="0" r="60" fill="url(#puff)"/>
      <circle cx="70" cy="-30" r="80" fill="url(#puff)"/>
      <circle cx="160" cy="-10" r="65" fill="url(#puff)"/>
      <circle cx="220" cy="20" r="45" fill="url(#puff)"/>
      <ellipse cx="110" cy="35" rx="150" ry="35" fill="#d7e7f7"/>
    </g>
    <g id="tree">
      <path d="M-9 0 Q-6 -60 -4 -110 L4 -110 Q6 -60 9 0 Z" fill="#7a4a2a"/>
      <circle cx="0" cy="-150" r="62" fill="url(#leaves)"/>
      <circle cx="-42" cy="-120" r="40" fill="url(#leaves)"/>
      <circle cx="44" cy="-118" r="42" fill="url(#leaves)"/>
      <circle cx="-14" cy="-172" r="12" fill="#c4f59c" opacity="0.6"/>
    </g>
    <g id="farTree">
      <rect x="-4" y="-40" width="8" height="40" fill="#8a6a4a"/>
      <circle cx="0" cy="-60" r="30" fill="url(#leavesFar)"/>
    </g>
    <g id="flower">
      <g fill="#ff7aa8">
        <circle cx="0" cy="-9" r="7"/><circle cx="8.5" cy="-3" r="7"/><circle cx="5.5" cy="7" r="7"/>
        <circle cx="-5.5" cy="7" r="7"/><circle cx="-8.5" cy="-3" r="7"/>
      </g>
      <circle r="5" fill="#ffd23f"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- sun and its soft rays -->
  <g opacity="0.9">
    <path d="M1260 190 L900 900 L1060 900 Z" fill="url(#ray)"/>
    <path d="M1260 190 L1180 900 L1330 900 Z" fill="url(#ray)"/>
    <path d="M1260 190 L1450 900 L1600 900 L1600 820 Z" fill="url(#ray)"/>
  </g>
  <circle cx="1260" cy="190" r="260" fill="url(#sunGlow)"/>
  <circle cx="1260" cy="190" r="70" fill="#fff8d8"/>

  <use href="#cloud" transform="translate(180 170) scale(0.9)"/>
  <use href="#cloud" transform="translate(700 110) scale(0.6)"/>
  <use href="#cloud" transform="translate(980 300) scale(0.45)" opacity="0.85"/>
  <use href="#cloud" transform="translate(1420 380) scale(0.5)" opacity="0.8"/>

  <!-- far away and hazy, so they look miles back -->
  <path d="M0 560 L180 430 L300 500 L470 380 L640 520 L820 410 L1000 530 L1180 420 L1360 520 L1600 440 V640 H0 Z" fill="url(#mountains)"/>
  <path d="M470 380 L430 420 L455 415 L480 428 L505 410 Z M820 410 L785 440 L812 436 L840 446 Z M1180 420 L1150 446 L1178 442 L1205 450 Z" fill="#ffffff" opacity="0.8"/>

  <path d="M0 600 Q220 520 480 575 T980 560 T1600 545 V700 H0 Z" fill="url(#farHill)"/>
  <use href="#farTree" transform="translate(260 560)"/>
  <use href="#farTree" transform="translate(320 572) scale(0.8)"/>
  <use href="#farTree" transform="translate(1340 548)"/>
  <use href="#farTree" transform="translate(1400 556) scale(0.75)"/>

  <!-- a little cottage on the hill -->
  <g transform="translate(1080 560)">
    <rect x="-38" y="-46" width="76" height="46" fill="#fff3dc"/>
    <path d="M-48 -44 L0 -84 L48 -44 Z" fill="#e2574c"/>
    <rect x="18" y="-92" width="12" height="26" fill="#b5543f"/>
    <rect x="-10" y="-28" width="18" height="28" fill="#8a5a3a"/>
    <rect x="-30" y="-36" width="14" height="14" fill="#7cc8f5"/>
    <rect x="18" y="-36" width="14" height="14" fill="#7cc8f5"/>
  </g>

  <path d="M0 660 Q300 580 650 640 T1600 610 V900 H0 Z" fill="url(#midHill)"/>
  <use href="#tree" transform="translate(140 690) scale(0.85)"/>
  <use href="#tree" transform="translate(1460 660) scale(0.95)"/>
  <use href="#tree" transform="translate(1530 690) scale(0.7)"/>

  <path d="M0 760 Q400 670 850 740 T1600 720 V900 H0 Z" fill="url(#nearHill)"/>
  <!-- the path wiggles off into the distance -->
  <path d="M640 900 C700 820 860 800 820 740 C790 700 900 680 960 650 L985 652 C940 690 840 712 870 745 C920 805 820 840 860 900 Z" fill="url(#path)"/>

  <!-- soft light on the near hill -->
  <ellipse cx="800" cy="790" rx="520" ry="70" fill="#c8f59a" opacity="0.25" filter="url(#soft)"/>

  <use href="#flower" transform="translate(180 820)"/>
  <use href="#flower" transform="translate(320 860) scale(1.2)"/>
  <use href="#flower" transform="translate(520 800) scale(0.8)"/>
  <use href="#flower" transform="translate(1080 830)"/>
  <use href="#flower" transform="translate(1260 800) scale(0.85)"/>
  <use href="#flower" transform="translate(1420 860) scale(1.25)"/>
  <g fill="#ffd23f">
    <circle cx="420" cy="845" r="6"/><circle cx="1180" cy="870" r="6"/><circle cx="980" cy="800" r="5"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
